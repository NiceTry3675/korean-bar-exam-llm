name: Test and build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Reject tracked HWP source files
        run: |
          if git ls-files -- '*.[hH][wW][pP]' '*.[hH][wW][pP][xX]' | grep -q .; then
            echo 'HWP/HWPX source files must remain untracked.' >&2
            exit 1
          fi

      - name: Run synthetic and regression tests without network access
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          OPENAI_API_KEY: ''
          ANTHROPIC_API_KEY: ''
          GOOGLE_API_KEY: ''
          OPENAI_CODEX_OAUTH_TOKEN: ''
          CLAUDE_CODE_OAUTH_TOKEN: ''
          PYTHON_KEYRING_BACKEND: keyring.backends.fail.Keyring
        run: python scripts/run_tests_offline.py

  web-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run dashboard tests
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
        run: npm test

      - name: Lint dashboard
        run: npm run lint

      - name: Build dashboard
        run: npm run build
